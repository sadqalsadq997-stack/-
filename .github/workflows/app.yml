# ══════════════════════════════════════════════════════════════════
# بناء تطبيق فلسي (Flutter) — أندرويد + آيفون + ويندوز
#
# التشغيل:
#   • يدوياً: GitHub ← Actions ← "Felsy App" ← Run workflow
#   • تلقائياً: عند رفع وسم مثل app-v1.0.0  (git tag app-v1.0.0 && git push --tags)
#
# الناتج (Artifacts في صفحة التشغيل):
#   • felsy-android  : app-release.aab (لـ Google Play) + app-release.apk (تثبيت مباشر على جوالك)
#   • felsy-windows  : felsy.msix (للمتجر/التثبيت) + felsy-windows.zip (نسخة تشغيل مباشرة)
#   • آيفون          : يرتفع مباشرة لـ App Store Connect ← TestFlight (إذا أضفت أسرار آبل)
#
# الأسرار (Settings ← Secrets and variables ← Actions) — راجع docs/PUBLISHING.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
#   (متغيرات Variables) MSIX_PUBLISHER, MSIX_IDENTITY_NAME, MSIX_PUBLISHER_DISPLAY_NAME
# بدون الأسرار: البناء يشتغل للتجربة (أندرويد بتوقيع تجريبي، آيفون بدون توقيع).
# ══════════════════════════════════════════════════════════════════

name: Felsy App

on:
  workflow_dispatch:
    inputs:
      ios_upload:
        description: 'رفع نسخة آيفون إلى TestFlight'
        type: boolean
        default: true
  push:
    tags: ['app-v*']

permissions:
  contents: read

concurrency:
  group: felsy-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'
  FELSY_API: 'https://felsy.org/api/db'

defaults:
  run:
    working-directory: app

jobs:
  # ── فحص الكود والاختبارات ──────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: v
        run: |
          echo "version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # ── أندرويد ──────────────────────────────────────────────────────────
  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: مفتاح التوقيع (من الأسرار)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/felsy-upload.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../felsy-upload.jks\n' "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
            echo "✓ توقيع Google Play"
          else
            echo "::warning::بدون ANDROID_KEYSTORE_BASE64 — توقيع تجريبي (للتجربة فقط، ما ينرفع للمتجر)"
          fi
      - run: flutter pub get
      - name: AAB (Google Play)
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=FELSY_API=${{ env.FELSY_API }}
          --dart-define=FELSY_VERSION=${{ needs.check.outputs.version }}
          --obfuscate --split-debug-info=build/symbols
      - name: APK (تثبيت مباشر)
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=FELSY_API=${{ env.FELSY_API }}
          --dart-define=FELSY_VERSION=${{ needs.check.outputs.version }}
          --obfuscate --split-debug-info=build/symbols
      - name: حذف المفتاح من جهاز البناء
        if: always()
        run: rm -f android/felsy-upload.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: felsy-android
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: felsy-android-symbols
          path: app/build/symbols
          retention-days: 90

  # ── ويندوز ───────────────────────────────────────────────────────────
  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: بناء ويندوز
        run: >
          flutter build windows --release
          --dart-define=FELSY_API=${{ env.FELSY_API }}
          --dart-define=FELSY_VERSION=${{ needs.check.outputs.version }}
      - name: نسخة مباشرة (zip)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/felsy-windows.zip -Force
      - name: حزمة MSIX
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $v = "${{ needs.check.outputs.version }}.0"
          if ($env:MSIX_PUBLISHER) {
            # للمتجر: Microsoft يوقّع الحزمة بنفسه
            dart run msix:create --build-windows false --store --version $v `
              --publisher "$env:MSIX_PUBLISHER" --identity-name "$env:MSIX_IDENTITY_NAME" `
              --publisher-display-name "$env:MSIX_PUBLISHER_DISPLAY_NAME"
          } else {
            Write-Host "::warning::بدون بيانات Partner Center — MSIX بتوقيع تجريبي (للتجربة فقط)"
            dart run msix:create --build-windows false --version $v
          }
          Copy-Item build/windows/x64/runner/Release/felsy.msix build/felsy.msix
      - uses: actions/upload-artifact@v4
        with:
          name: felsy-windows
          path: |
            app/build/felsy.msix
            app/build/felsy-windows.zip
          if-no-files-found: error

  # ── آيفون ────────────────────────────────────────────────────────────
  # آبل تلزم البناء بـ Xcode 26 (iOS 26 SDK) منذ 28 أبريل 2026
  ios:
    needs: check
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: بناء آيفون (بدون توقيع)
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=FELSY_API=${{ env.FELSY_API }}
          --dart-define=FELSY_VERSION=${{ needs.check.outputs.version }}
          --obfuscate --split-debug-info=build/symbols
      - name: توقيع ورفع إلى TestFlight
        if: env.ASC_KEY_P8_BASE64 != '' && (github.event_name == 'push' || inputs.ios_upload)
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive
          # destination=upload في ExportOptions ⇒ يرتفع مباشرة لـ App Store Connect
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/ipa "${AUTH[@]}"
          rm -f "$KEY"
      - name: تنبيه
        if: env.ASC_KEY_P8_BASE64 == ''
        run: echo "::warning::بدون أسرار App Store Connect — تم التأكد من البناء فقط بدون رفع"
